      operationId: merge_post
      summary: Merge an alert cluster into a case
      tags:
      - AlertClusters
      security:
      - ApiKey: []
      description: "Mirrors the alert-merge endpoint (`POST /alerts/merge/<alert_id>`) but\nfanned across\
        \ every alert on the cluster. `target_case_id` in the body\npicks the destination case; the caller\
        \ must have full case access to\nit (read-only isn't enough \u2014 merging mutates the case description,\n\
        IOCs, assets, and optionally the timeline)."
