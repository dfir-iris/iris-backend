      description: "Returns just the few numbers the dashboard tile renders \u2014 keeps the\npayload\
        \ tiny so the call is cheap on every navigation. The full\nStatistics page is served by the seeded\
        \ custom dashboard, not by\nthis endpoint.\n\nResponse shape:\n{\n\"assigned_alerts\": {\n\"count\"\
        : int,\n\"filter\": {\"alert_owner_id\": int, \"alert_status_id\": [int, ...]}\n},\n\"open_cases_count\"\
        : int,\n\"cases_closed_last_30d\": int,\n}\n\nThe `filter` block under `assigned_alerts` lets\
        \ the frontend deep-link\ninto the alerts page with the same predicate that produced the count\n\
        \u2014 no second round-trip to discover which status ids count as \"open\"."
