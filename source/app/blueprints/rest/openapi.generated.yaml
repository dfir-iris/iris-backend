  /api/v2/mcp/tools/iris_alerts_list:
    post:
      operationId: mcp_tool_iris_alerts_list
      summary: 'Search alerts visible to the caller. All filters are optional; omit them to page through
        every alert the caller has access to. Prefer the `query` expression over the scalar filters: it
        says in one string what most of them say together, and it resolves names so no id lookup is needed
        first. Rows come back as triage summaries; use `iris_alerts_get` for one alert in full, including
        its raw source payload.'
      tags:
      - MCP
      - MCP:tools
      security:
      - ApiKey: []
      x-mcp: true
      x-mcp-tool: iris_alerts_list
      x-mcp-mvp: true
      x-mcp-admin-only: false
      description: "Synthesised documentation entry \u2014 MCP tools are actually dispatched via a single\
        \ POST /api/v2/mcp with `method: \"tools/call\"` and `params.name = \"iris_alerts_list\"`. The\
        \ request body schema below is the tool's `input_schema` (identical to what `tools/list` returns\
        \ for this tool)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                view:
                  type: string
                  enum:
                  - summary
                  - full
                  description: "Response detail level. 'summary' (the default) returns the identifying,\
                    \ triage and cross-reference fields. 'full' adds raw source payloads, enrichment blobs,\
                    \ custom attributes and modification history, and is typically an order of magnitude\
                    \ larger. Stay on the default unless a field you need is genuinely absent \u2014 to\
                    \ read one record in full, prefer the matching `*_get` tool over widening a whole\
                    \ page of results."
                query:
                  type: string
                  description: 'Lucene-style search expression, ANDed with the other filters. Values are
                    names, not ids: `status:Closed severity:>=High`, `owner:me`, `is:open is:unassigned`,
                    `asset:*.corp.local`, `created:>now-24h`, `source:crowdstrike OR source:sentinel`,
                    `context.rule_name:"brute force"`, `-status:Merged`. Supports AND / OR / NOT (or `-`),
                    parentheses, quoted phrases, ranges `[a TO b]`, and `*` / `?` wildcards. A bare word
                    searches title, description, source, reference, tags and note. `is:` takes open, closed,
                    assigned, unassigned, escalated, merged, resolved, unresolved, clustered, orphan,
                    in_case, no_case. A malformed expression is rejected with the offset of the problem,
                    so it can be corrected and retried.'
                page:
                  type: integer
                per_page:
                  type: integer
                sort:
                  type: string
                  description: Field to sort by, prefixed with - for descending.
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                severity:
                  type: integer
                owner:
                  type: integer
                source:
                  type: string
                tags:
                  type: string
                case_identifier:
                  type: integer
                customer_identifier:
                  type: integer
                classification:
                  type: integer
                alert_identifiers:
                  type: string
                  description: Comma-separated list of IDs.
                assets:
                  type: string
                iocs:
                  type: string
                resolution_status:
                  type: integer
                source_reference:
                  type: string
                start_date:
                  type: string
                end_date:
                  type: string
                source_start_date:
                  type: string
                source_end_date:
                  type: string
      responses:
        '200':
          description: "Tool result \u2014 JSON-RPC content wrapper."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpToolResult'
        '403':
          $ref: '#/components/responses/Forbidden'
