  /api/v2/cases/{case_identifier}/assets/{identifier}/links:
    get:
      operationId: get_asset_other_case_links_get
      summary: List other cases sharing this asset
      tags:
      - CaseAssets
      security:
      - ApiKey: []
      description: "\"Same asset\" matches the legacy v2.4.x heuristic: same name + same type\non a case\
        \ belonging to the same customer that the current user has at\nleast read access to. The customer-scoping\
        \ is important \u2014 it stops a\ngeneric name like `localhost` from lighting up across every\
        \ tenant on\nthe instance."
      parameters:
      - name: case_identifier
        in: path
        required: true
        schema:
          type: integer
      - name: identifier
        in: path
        required: true
