  /api/v2/mcp/resources:
    get:
      operationId: mcp_resources_list
      summary: List MCP resource templates
      description: "Synthesised documentation entry \u2014 the runtime call is POST /api/v2/mcp with `method:\
        \ \"resources/templates/list\"`. Each template can be read via `method: \"resources/read\"` +\
        \ `params.uri = <template>` with the placeholder(s) filled in."
      tags:
      - MCP
      - MCP:resources
      security:
      - ApiKey: []
      x-mcp: true
      responses:
        '200':
          description: Registered resource templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResourceTemplateList'
              examples:
                iris_alert_cluster:
                  summary: Full alert-cluster record (grouping of related alerts).
                  value:
                    uri: iris://alert-clusters/{cluster_id}
                iris_alert_cluster_graph:
                  summary: "Correlation graph payload for an alert cluster \u2014 nodes/edges of the alerts,\
                    \ IOCs, assets, and cases inside the cluster."
                  value:
                    uri: iris://alert-clusters/{cluster_id}/graph
                iris_alert:
                  summary: Full IRIS alert record.
                  value:
                    uri: iris://alerts/{alert_id}
                iris_case:
                  summary: Full IRIS case record.
                  value:
                    uri: iris://cases/{case_id}
                iris_case_activities:
                  summary: Activity-log entries for a case (analyst / MCP audit trail).
                  value:
                    uri: iris://cases/{case_id}/activities
                iris_case_assets:
                  summary: Assets attached to a case.
                  value:
                    uri: iris://cases/{case_id}/assets
                iris_case_events:
                  summary: Timeline events attached to a case (chronological).
                  value:
                    uri: iris://cases/{case_id}/events
                iris_case_evidences:
                  summary: Evidences attached to a case.
                  value:
                    uri: iris://cases/{case_id}/evidences
                iris_case_followers:
                  summary: Users following this case (dashboard star / mention scope).
                  value:
                    uri: iris://cases/{case_id}/followers
                iris_case_iocs:
                  summary: IOCs attached to a case.
                  value:
                    uri: iris://cases/{case_id}/iocs
                iris_case_notes:
                  summary: Notes attached to a case (title + summary).
                  value:
                    uri: iris://cases/{case_id}/notes
                iris_case_source_alert_cluster:
                  summary: Alert cluster this case was created from (via escalate/merge). Empty payload
                    when the case was not sourced from a cluster.
                  value:
                    uri: iris://cases/{case_id}/source-alert-cluster
                iris_case_tasks:
                  summary: Tasks attached to a case.
                  value:
                    uri: iris://cases/{case_id}/tasks
                iris_case_timelines:
                  summary: Grouped timelines defined on a case.
                  value:
                    uri: iris://cases/{case_id}/timelines
                iris_case_war_rooms:
                  summary: War rooms this case is attached to.
                  value:
                    uri: iris://cases/{case_id}/war-rooms
                iris_me:
                  summary: Calling user profile.
                  value:
                    uri: iris://me
                iris_me_context:
                  summary: Calling user runtime context (permissions, IRIS version).
                  value:
                    uri: iris://me/context
                iris_runtime_config:
                  summary: Server runtime configuration surface (mirrors GET /api/v2/runtime-config).
                  value:
                    uri: iris://runtime-config
                iris_war_room:
                  summary: Full war-room record.
                  value:
                    uri: iris://war-rooms/{war_room_id}
                iris_war_room_cases:
                  summary: Cases attached to a war room.
                  value:
                    uri: iris://war-rooms/{war_room_id}/cases
                iris_war_room_chat:
