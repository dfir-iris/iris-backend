          type: array
          items:
            type: integer
        description: Restrict to these customers
        style: form
        explode: true
      - name: asset_type_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Restrict to these asset types
        style: form
        explode: true
      - name: criticality
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Restrict to these criticalities
        style: form
        explode: true
      - name: environment
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Restrict to these environments
        style: form
        explode: true
      - name: tag
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Substring match on the tags field, one filter per tag
        style: form
        explode: true
      - name: owner
        in: query
        required: false
        schema:
          type: string
        description: Substring match on the owner field
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Substring match on name, ip, domain and description
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: Only active or only retired assets
      - name: has_sightings
        in: query
        required: false
        schema:
          type: boolean
