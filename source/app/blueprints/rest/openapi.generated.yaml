  /api/v2/auth/oidc-exchange:
    post:
      operationId: oidc_exchange_post
      summary: Exchange OIDC session for JWT tokens
      tags:
      - Auth
      security:
      - ApiKey: []
      description: "tokens, then invalidate the session so the cookie can't be reused.\n\nSecurity model:\n\
        - Only redeemable when the Flask session was created by a successful\nOIDC callback in this same\
        \ session (checked via the one-time\n`oidc_authenticated` flag set in login.oidc_authorise). A\
        \ plain\nlocal-login session, or a session hydrated some other way, is\nrejected \u2014 this endpoint\
        \ is not a general session->JWT converter.\n- Single-use: the flag is popped and the session is\
        \ fully cleared\nbefore the response is returned, so the same session cookie\ncannot mint a second\
        \ set of tokens even if the browser replays.\n- MFA is trusted from the IdP for OIDC users (mirrors\
        \ wrap_login_user's\nis_oidc=True branch, which skips IRIS's local MFA prompt). Tokens\nare minted\
        \ with mfa_verified=True \u2014 same policy as the existing\nsession-based OIDC login has today."
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/auth/refresh-token:
    post:
      operationId: refresh_token_endpoint_post
      summary: Refresh authentication tokens
      tags:
      - Auth
      security:
      - ApiKey: []
      description: 'The exchange is one-shot: the refresh token presented here stops

        working the moment its replacement is issued, so callers must store

        the new pair and never retry with the old one. Presenting an

        already-exchanged token invalidates the whole session and requires a

        fresh login.'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
