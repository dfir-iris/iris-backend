      security:
      - ApiKey: []
      description: "Same behaviour as `DELETE /api/v2/cases/{case_id}/source-cluster`\nbut rooted at the\
        \ cluster URL so the cluster-detail page's\n\"Unlink from case\" menu can hit it without knowing\
        \ the case id.\nRequires the caller to have write access to the target case \u2014 a\nuser who\
        \ can't touch the case shouldn't be able to strip its\nsource-cluster link either."
