  /api/v2/cases:
    get:
      operationId: get_cases_get
      summary: List cases
      tags:
      - Cases
      security:
      - ApiKey: []
      description: 'Supports the same query parameters as the case list UI: name,

        customer, classification, owner, state, severity, date ranges,

        and a `quick_search` free-text filter used by the context switcher.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number (default 1)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Page size (default 10)
      - name: order_by
        in: query
        required: false
        schema:
          type: string
        description: Column to sort by
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
        description: 'Sort direction: ''asc'' or ''desc'''
      - name: case_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list of case identifiers to restrict the result to
      - name: case_customer_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by customer identifier
      - name: case_name
        in: query
        required: false
        schema:
          type: string
        description: Filter by case name (substring match)
      - name: case_description
        in: query
        required: false
        schema:
          type: string
        description: Filter by description (substring match)
      - name: case_classification_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by classification identifier
      - name: case_owner_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by owner user identifier
      - name: case_opening_user_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by the user who opened the case
      - name: case_severity_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by severity identifier
      - name: case_state_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by state identifier
      - name: case_soc_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by external SOC identifier
      - name: start_open_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Restrict to cases opened on or after this date (YYYY-MM-DD)
      - name: end_open_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Restrict to cases opened on or before this date (YYYY-MM-DD)
      - name: start_close_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Restrict to cases closed on or after this date (YYYY-MM-DD)
      - name: end_close_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Restrict to cases closed on or before this date (YYYY-MM-DD)
      - name: is_open
        in: query
        required: false
        schema:
          type: boolean
        description: Restrict to open (true) or closed (false) cases
      - name: quick_search
        in: query
        required: false
        schema:
          type: string
        description: Free-text search across case name, customer name, and case identifier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseSchemaForAPIV2'
                  last_page:
                    type: integer
                  current_page:
                    type: integer
                  next_page:
                    type:
                    - integer
                    - 'null'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: create_case_post
      summary: Create a case
      tags:
      - Cases
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSchemaForAPIV2Request'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSchemaForAPIV2'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
