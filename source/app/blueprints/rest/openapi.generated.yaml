components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer <api-key> \u2014 the key from your profile."
  responses:
    ApiError:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data: {}
            required:
            - message
    Forbidden:
      description: Insufficient permissions to access resource
    NotFound:
      description: Resource not found
    Deleted:
      description: Resource successfully deleted
    Unauthorized:
      description: Missing or invalid API key / Bearer token
  schemas:
    Alert:
      type: object
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        customer:
          $ref: '#/components/schemas/Customer'
        classification:
          $ref: '#/components/schemas/CaseClassification'
        owner:
          $ref: '#/components/schemas/User'
        iocs:
          type: array
          items:
            $ref: '#/components/schemas/Ioc'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/CaseAssets'
        resolution_status:
          $ref: '#/components/schemas/AlertResolution'
        cases: {}
        clusters: {}
        investigation_flow: {}
        alert_id:
          type: integer
          format: int64
        alert_uuid:
          type: string
          format: uuid
        alert_title:
          type: string
        alert_description:
          type:
          - string
          - 'null'
        alert_source:
          type:
          - string
          - 'null'
        alert_source_ref:
          type:
          - string
          - 'null'
        alert_source_link:
          type:
          - string
          - 'null'
        alert_source_content:
          type:
          - object
          - 'null'
        alert_severity_id:
          type: integer
