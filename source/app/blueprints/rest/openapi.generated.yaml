components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer <api-key> \u2014 the key from your profile."
  responses:
    ApiError:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data: {}
            required:
            - message
    Forbidden:
      description: Insufficient permissions to access resource
    NotFound:
      description: Resource not found
    Deleted:
      description: Resource successfully deleted
  schemas:
    Alert:
      type: object
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        customer:
          $ref: '#/components/schemas/Customer'
        classification:
          $ref: '#/components/schemas/CaseClassification'
        owner:
          $ref: '#/components/schemas/User'
        iocs:
          type: array
          items:
            $ref: '#/components/schemas/Ioc'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/CaseAssets'
        resolution_status:
          $ref: '#/components/schemas/AlertResolution'
        cases: {}
        clusters: {}
        investigation_flow: {}
      description: Schema for serializing and deserializing Alert objects.
    AlertCluster:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AlertClusterStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        customer:
          $ref: '#/components/schemas/Customer'
        owner:
          $ref: '#/components/schemas/User'
        alert_ids: {}
        investigation_flow: {}
        source_rule: {}
    AlertClusterInvestigationProgress:
      type: object
      properties:
        completed_by:
          $ref: '#/components/schemas/User'
    AlertClusterStatus:
      type: object
      properties: {}
    AlertInvestigationProgress:
      type: object
      properties:
        completed_by:
          $ref: '#/components/schemas/User'
    AlertResolution:
      type: object
      properties: {}
      description: Schema for serializing and deserializing AlertResolution objects.
    AlertStatus:
      type: object
      properties: {}
      description: Schema for serializing and deserializing AlertStatus objects.
    AnalysisStatus:
      type: object
      properties: {}
      description: Schema for serializing and deserializing AnalysisStatus objects.
    AssetType:
      type: object
      properties:
        asset_name: {}
        asset_description: {}
        asset_icon_compromised: {}
        asset_icon_not_compromised: {}
      required:
      - asset_name
      - asset_description
      description: Schema for serializing and deserializing AssetsType objects.
    Case:
      type: object
      properties:
        case_name: {}
        case_description: {}
        case_soc_id: {}
        case_customer: {}
        case_organisations:
          type: array
          items:
            type: integer
        protagonists:
          type: array
          items:
            type: object
        case_tags:
          type: string
        classification_id: {}
        reviewer_id: {}
        review_status: {}
        severity_id: {}
      required:
      - case_name
      - case_description
      - case_soc_id
      - case_customer
      description: Schema for serializing and deserializing Case objects.
    CaseAssets:
      type: object
      properties:
        asset_name: {}
        asset_type_id: {}
        ioc_links:
          type: array
          items:
            type: integer
        asset_enrichment: {}
