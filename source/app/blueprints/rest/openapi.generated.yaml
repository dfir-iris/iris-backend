    get:
      operationId: get_custom_attribute_get
      summary: Get a custom attribute definition
      tags:
      - ManageCustomAttributes
      security:
      - ApiKey: []
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: update_custom_attribute_put
      summary: Update a custom attribute definition
      tags:
      - ManageCustomAttributes
      security:
      - ApiKey: []
      description: "Body shape:\n\n{\n\"attribute_content\": \"<JSON-stringified schema>\" | {schema},\n\
        \"complete_overwrite\": <bool>,   # optional\n\"partial_overwrite\": <bool>     # optional\n}\n\
        \n`attribute_content` is accepted as either a raw object or a\nJSON-encoded string \u2014 the\
        \ legacy admin page sent it stringified;\nthe new SPA panel will send the object directly. Both\
        \ paths feed\ninto `validate_attribute` which expects a string, so we re-encode\nwhen needed.\n\
        \n`complete_overwrite` / `partial_overwrite` propagate into\n`update_all_attributes` so the change\
        \ is back-filled across every\nexisting record of the matching object type."
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/manage/custom-attributes/validate:
    post:
      operationId: validate_custom_attribute_post
      summary: Validate a custom attribute schema
      tags:
      - ManageCustomAttributes
      security:
      - ApiKey: []
      description: "The SPA calls this from the edit modal so admins can see the\nexact per-field error\
        \ list before committing (the PUT would run\n`update_all_attributes` and back-fill every existing\
        \ row, which\nis expensive \u2014 surfacing validation errors early avoids paying\nthat cost only\
        \ to be rejected).\n\nBody: `{\"attribute_content\": <object | JSON string>}`.\nReturns `{ok:\
        \ bool, logs: [...]}` \u2014 `logs` is empty on success."
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
