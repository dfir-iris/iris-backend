  /api/v2/alerts/grouped:
    get:
      operationId: alerts_grouped_list_route_get
      summary: List alerts with clustered alerts collapsed into their cluster
      tags:
      - Alerts
      security:
      - ApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number (default 1)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Page size (default 10)
      - name: order_by
        in: query
        required: false
        schema:
          type: string
        description: 'Column to sort by: event_time, creation_time, title, severity, status, customer_name,
          owner (default ''event_time'')'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Sort direction: ''asc'' or ''desc'' (default ''asc'')'
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: "Lucene-style search expression, ANDed with every other filter. Fields are friendly\
          \ aliases resolved server-side \u2014 `status:Closed`, `severity:>=High`, `owner:me`, `asset:*.corp.local`,\
          \ `created:>now-24h`, `context.rule_name:\"brute force\"`, `is:open`. Supports AND / OR / NOT\
          \ (or `-`), parentheses, quoted phrases, ranges `[a TO b]` / `{a TO b}` and `*` / `?` wildcards.\
          \ A bare term searches title, description, source, reference, tags and note. GET /alerts/search-schema\
          \ lists every alias. A malformed expression returns 400 with the character offset in `data.position`."
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
