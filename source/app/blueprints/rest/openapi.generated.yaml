openapi: 3.1.0
info:
  title: IRIS
  version: 2.1.0
  description: "IRIS REST API \u2014 automatically generated from the Flask backend."
  contact:
    name: DFIR-IRIS
    email: contact@dfir-iris.org
  license:
    name: LGPLv3
    url: https://www.gnu.org/licenses/lgpl-3.0.txt
security:
- ApiKey: []
paths:
  /api/v2/activities:
    get:
      operationId: list_activities_endpoint_get
      summary: List activities
      tags:
      - Activities
      security:
      - ApiKey: []
      description: "Query params:\n- page (int, default 1)\n- per_page (int, default 25, max 200)\n- search\
        \ (str, optional) \u2014 ILIKE filter on activity_desc\n- include_non_case (bool, default false)\
        \ \u2014 include rows with no\nassociated case. Only honoured when the caller has the\n``all_activities_read``\
        \ permission (otherwise non-case rows from\nother users would leak across tenants).\n- user_id\
        \ (int, optional) \u2014 restrict to a single author\n- case_id (int, optional) \u2014 restrict\
        \ to a single case"
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/alert-clusters:
    get:
      operationId: list_clusters_get
      summary: List alert clusters
      tags:
      - AlertClusters
      security:
      - ApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertCluster'
                  last_page:
                    type: integer
                  current_page:
                    type: integer
                  next_page:
                    type:
                    - integer
                    - 'null'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: create_cluster_post
      summary: Create an alert cluster
      tags:
      - AlertClusters
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertClusterRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertCluster'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/alert-clusters/{cluster_identifier}/comments:
