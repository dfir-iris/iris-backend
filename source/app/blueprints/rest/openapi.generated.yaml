      description: "grouped into a cluster are skipped so the rule can't hijack an\nanalyst's manual grouping.\
        \ The dedupe / time-window logic keeps the\noperation idempotent \u2014 re-running produces no\
        \ duplicates.\n\nLoaded through the scope-gated `rules_get` so a caller who can't\nsee every tenant\
