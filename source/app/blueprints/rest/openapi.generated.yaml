  /api/v2/alert-clusters/{identifier}/graph:
    get:
      operationId: graph_get
      summary: Get an alert cluster correlation graph
      tags:
      - AlertClusters
      security:
      - ApiKey: []
      description: "Returns `{nodes, edges}` linking every member alert to its IOCs and\nassets, with\
        \ IOC/asset nodes deduplicated across alerts so shared\nindicators show as junction points \u2014\
        \ the analyst's whole reason for\nlooking at this view. Read-only, gated by cluster (customer)\n\
        access; the payload only carries labels/titles/ids that a reader\nalready sees on the alerts tab,\
        \ so no extra ACL is needed."
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
