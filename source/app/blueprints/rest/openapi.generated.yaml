  /api/v2/manage/case-templates/schema:
    get:
      operationId: get_case_template_schema_get
      summary: Describe the case template schema
      tags:
      - ManageCaseTemplates
      security:
      - ApiKey: []
      description: "Returned shape is consumed by the interactive editor to build the\nform. Keeping introspection\
        \ here (rather than client-side) keeps\nthe form in lockstep with the backend schema \u2014 adding\
        \ a field to\n`CaseTemplateSchema` adds an input on the form on the next reload.\n\n`tasks` is\
        \ special-cased: it's stored as raw JSON on the model\nand never declared as a Marshmallow field,\
        \ but the post-modifier\ntreats it as a structured list. We expose it as if it were a\ndeclared\
        \ field so the UI can build the same repeater the rest of\nthe form uses."
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
