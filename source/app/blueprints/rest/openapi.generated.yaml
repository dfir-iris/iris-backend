    get:
      operationId: get_ioc_other_case_links_get
      summary: List other cases sharing this IOC
      tags:
      - CaseIocs
      security:
      - ApiKey: []
      description: "Mirrors the v2.4.x analyst affordance: when working a new case, surfacing\nthat an\
        \ IOC has been seen on a previous one (and which one) is one of\nthe highest-signal pivots an\
        \ analyst gets. The legacy UI lit a small\nbadge on each IOC row and exposed the same data through\
        \ a tooltip; we\nkeep that semantic and let the SPA decide how to render it.\n\nThe lookup is\
        \ gated by the same per-user case-access filter the legacy\n`/case/ioc/list` route used, so analysts\
        \ only see hits in cases they're\nalready allowed to read \u2014 no information leakage across\
        \ access\nboundaries."
      parameters:
      - name: case_identifier
        in: path
        required: true
        schema:
          type: integer
      - name: identifier
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
