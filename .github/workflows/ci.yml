#  IRIS Source Code
#  contact@dfir-iris.org
#
#  Continuous Integration for iris-backend.
#
#  Runs static checks (ruff, import-linter, vulture), then builds
#  db + backend images to a tar artifact, loads them into the test
#  runner, brings up docker-compose.test.yml, and runs the Python
#  unittest + database migration suites against the live stack.
#
#  End-to-end tests against the SvelteKit UI live in the iris-web
#  meta-repo — see iris-web/.github/workflows/e2e.yml.

name: Continuous Integration
on: [push, pull_request]

env:
  REGISTRY: ghcr.io
  CI_DB_IMAGE: ghcr.io/dfir-iris/iris-db:ci-${{ github.run_id }}-${{ github.run_attempt }}
  CI_APP_IMAGE: ghcr.io/dfir-iris/iris-backend:ci-${{ github.run_id }}-${{ github.run_attempt }}
  # Local tags must be run-scoped too. The runner is shared, so a fixed
  # `iris-db:ci` collides with whatever else already holds that tag
  # ("AlreadyExists: image docker.io/library/iris-db:ci"). Consumed by
  # docker-compose.test.yml, which falls back to the plain tag locally.
  LOCAL_DB_IMAGE: iris-db:ci-${{ github.run_id }}-${{ github.run_attempt }}
  LOCAL_APP_IMAGE: iris-backend:ci-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:

  static-checks:
    name: Static analysis checks
    runs-on: self-hosted
    steps:
      - name: Check out iris-backend
        uses: actions/checkout@v4
      - name: Check source with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - name: Set up a virtualenv for the tooling
        run: |
          # The runner's system Python is externally managed (PEP 668), so
          # `pip install` refuses to touch it — including the `--user` install
          # the steps below used to rely on. A venv is the sanctioned way in,
          # keeps a shared self-hosted runner's interpreter clean, and is what
          # the test jobs further down already do.
          #
          # Kept deliberately free of --system-site-packages: everything these
          # steps need is installed explicitly (import-linter, vulture,
          # pyyaml — the OpenAPI generator is pure-AST and imports nothing
          # else), and inheriting the system packages would let a pre-existing
          # copy of one of these tools answer "already satisfied" so its
          # console script never lands in the venv's bin.
          #
          # $GITHUB_PATH publishes the venv to every later step in this job,
          # which is what makes `lint-imports` and `vulture` resolvable at
          # all — before PEP 668 broke the install outright, they were landing
          # in a user base that was not on PATH, exiting 127, and the layering
          # contract was never actually enforced.
          python3 -m venv "${{ runner.temp }}/ci-venv"
          echo "${{ runner.temp }}/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Check import dependencies with import-linter
        run: |
          pip install import-linter
          PYTHONPATH=source lint-imports
      - name: Looking for dead code with vulture
        run: |
          pip install vulture
          vulture
      - name: OpenAPI spec drift check
        run: |
          # The generator is pure-AST (no app boot, no DB) so it runs
          # in the static-checks lane. If it produces something
          # different from the checked-in file, print the diff and
          # fail with a hint to regenerate.
          pip install pyyaml
          cd source
          python3 -m scripts.generate_openapi --output /tmp/openapi.generated.yaml
          if ! diff -u app/blueprints/rest/openapi.generated.yaml /tmp/openapi.generated.yaml; then
            echo '::error::OpenAPI spec is out of date. Run `cd source && python -m scripts.generate_openapi --output app/blueprints/rest/openapi.generated.yaml` and commit.'
            exit 1
          fi

  build-docker-db:
    name: Build docker db
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out iris-backend
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: docker/db
          tags: ${{ env.CI_DB_IMAGE }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-docker-app:
    name: Build docker backend
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out iris-backend
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webApp/Dockerfile
          tags: ${{ env.CI_APP_IMAGE }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

  test-api:
    name: Test API
    runs-on: self-hosted
    permissions:
      packages: read
      contents: read
    needs:
      - build-docker-db
      - build-docker-app
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images for tests
        run: |
          docker pull "${{ env.CI_DB_IMAGE }}"
          docker pull "${{ env.CI_APP_IMAGE }}"
          docker tag "${{ env.CI_DB_IMAGE }}" "${{ env.LOCAL_DB_IMAGE }}"
          docker tag "${{ env.CI_APP_IMAGE }}" "${{ env.LOCAL_APP_IMAGE }}"
      - name: Check out iris-backend
        uses: actions/checkout@v4
      - name: Start test stack
        run: |
          cp .env.tests.model .env
          docker compose --file docker-compose.test.yml up --detach --wait
      - name: Inspect test stack start failure
        if: ${{ failure() || cancelled() }}
        run: |
          # Best-effort: the runner has no jq, and under `bash -e` that killed
          # the step before it reached the logs — which is the one thing worth
          # having here. `free` is in: start failures on a shared runner have
          # been memory pressure, not the stack itself.
          set +e
          free -m
          docker ps --all
          for container in iris_db iris_app iris_worker; do
            docker inspect --format "{{json .State}}" "${container}"
          done
          docker compose --file docker-compose.test.yml logs
          exit 0
      - name: Run tests
        working-directory: tests
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          PYTHONUNBUFFERED=true python3 -m unittest --verbose
      - name: Check the absence of errors/stack traces in logs
        run: |
          ! docker compose --file docker-compose.test.yml logs app | grep Traceback -A100
      - name: Stop test stack
        if: ${{ always() }}
        run: |
          docker compose --file docker-compose.test.yml logs > "${{ runner.temp }}/iris-backend.log"
          docker compose --file docker-compose.test.yml down
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Test API logs
          path: ${{ runner.temp }}/iris-backend.log
          retention-days: 7

  test-database-migration:
    name: Database migration tests
    runs-on: self-hosted
    permissions:
      packages: read
      contents: read
    needs:
      - build-docker-db
      - build-docker-app
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images for tests
        run: |
          docker pull "${{ env.CI_DB_IMAGE }}"
          docker pull "${{ env.CI_APP_IMAGE }}"
          docker tag "${{ env.CI_DB_IMAGE }}" "${{ env.LOCAL_DB_IMAGE }}"
          docker tag "${{ env.CI_APP_IMAGE }}" "${{ env.LOCAL_APP_IMAGE }}"
      - name: Check out iris-backend
        uses: actions/checkout@v4
      - name: Set up .env file
        run: cp .env.tests.model .env
      - name: Run tests
        working-directory: tests_database_migration
        # Own container/network prefix and host port: this job runs at the
        # same time as test-api on the same runner, against the same
        # compose file.
        env:
          IRIS_CONTAINER_PREFIX: iris_migration
          IRIS_DB_HOST_PORT: "5433"
          IRIS_APP_HOST_PORT: "8001"
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          PYTHONUNBUFFERED=true python3 -m unittest --verbose

  cleanup-ci-images:
    name: Cleanup temporary CI images
    if: ${{ always() }}
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    needs:
      - test-api
      - test-database-migration
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Best-effort cleanup temporary CI tags
        continue-on-error: true
        run: |
          refs=(
            "${{ env.CI_DB_IMAGE }}"
            "${{ env.CI_APP_IMAGE }}"
          )

          if command -v oras >/dev/null 2>&1; then
            for ref in "${refs[@]}"; do
              oras manifest delete "$ref"
            done
          elif command -v crane >/dev/null 2>&1; then
            for ref in "${refs[@]}"; do
              crane delete "$ref"
            done
          else
            echo "No registry cleanup CLI available; leaving temporary CI tags in place."
          fi
