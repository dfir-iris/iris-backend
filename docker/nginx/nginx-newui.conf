worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $request_uri $csp_header {
        # `blob:` is required so authenticated avatars (fetched as
        # bytes and exposed via URL.createObjectURL) can render, and so
        # the /api-docs page can hand Redoc the OpenAPI spec via a
        # blob: URL (the spec is fetched with a Bearer token by the SPA
        # and passed to Redoc's `spec-url` attribute).
        # `connect-src` must be explicit — otherwise browsers fall back
        # to `default-src` for XHR + WebSocket connections, and `default-src`
        # doesn't cover the `ws:` / `wss:` schemes Socket.IO uses for
        # the /collab namespace (real-time markdown collab in case notes,
        # war-room notes, and sitreps). Without `ws: wss:` here, every
        # collab editor hangs on its sync-init handshake.
        # `cdn.redoc.ly` + Google Fonts are whitelisted so the /api-docs
        # page can pull Redoc's standalone bundle and its font stack.
        # `worker-src blob:` because Redoc spawns a web-worker from a
        # blob URL for search index building.
        default "default-src 'self' https://analytics.dfir-iris.org https://127.0.0.1 http://app:8000; connect-src 'self' https://analytics.dfir-iris.org https://127.0.0.1 http://app:8000 ws: wss: blob:; script-src 'self' 'unsafe-inline' https://analytics.dfir-iris.org https://cdn.redoc.ly; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:;";
    }

    # The origin the browser is actually on, rebuilt per request.
    #
    # SvelteKit's adapter-node derives `event.url` from X-Forwarded-Host
    # and X-Forwarded-Proto (HOST_HEADER / PROTOCOL_HEADER in the
    # frontend env) and then rejects any form POST whose `Origin` header
    # does not match it — "Cross-site POST form submissions are
    # forbidden", which in practice means nobody can log in. Two things
    # made that origin wrong on a custom domain:
    #
    #   * `$host` drops the port, so a deployment published on anything
    #     other than 443 answered `Origin: https://iris.example:8443`
    #     with `https://iris.example`. `$http_host` keeps the
    #     authority exactly as the browser sent it.
    #   * behind a second proxy (a tunnel, an ingress, a load balancer
    #     terminating TLS) the real hostname already arrives in
    #     X-Forwarded-Host; overwriting it with the name that proxy used
    #     to reach *us* substituted an internal hostname for the
    #     browser's.
    #
    # So an inbound X-Forwarded-* wins, and our own view of the request
    # is the fallback. Only the first entry of a comma-separated chain
    # is the client-facing one. Trusting the header is not a weakening
    # of the CSRF check: a browser cannot set X-Forwarded-Host on a
    # cross-site form submission, and a client that can set arbitrary
    # headers is not subject to CSRF in the first place.
    map $http_x_forwarded_host $iris_forwarded_host {
        ""                  $http_host;
        "~^\s*([^,\s]+)"    $1;
        default             $http_host;
    }

    map $http_x_forwarded_proto $iris_forwarded_proto {
        ""                  $scheme;
        "~^\s*([^,\s]+)"    $1;
        default             $scheme;
    }

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log debug;

    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    types_hash_max_size             2048;
    types_hash_bucket_size          128;
    proxy_headers_hash_max_size     2048;
    proxy_headers_hash_bucket_size  128;
    proxy_buffering                 on;
    # SvelteKit's Node server can emit response headers that exceed
    # nginx's default 4k header buffer (large `Set-Cookie` chains, CSP
    # nonces, etc.) — bump the header buffer to 32k and widen the body
    # buffers in proportion so we don't stall on the first proxied
    # response with "upstream sent too big header".
    proxy_buffers                   16 32k;
    proxy_buffer_size               32k;
    proxy_busy_buffers_size         64k;

    client_header_buffer_size   2k;
    large_client_header_buffers 8 64k;
    client_body_buffer_size     64k;
    client_max_body_size        100M;

    reset_timedout_connection   on;
    keepalive_timeout           90s;
    client_body_timeout         90s;
    send_timeout                90s;
    client_header_timeout       90s;
    fastcgi_read_timeout        90s;
    # WORKING TIMEOUT FOR PROXY CONF
    proxy_read_timeout          90s;
    uwsgi_read_timeout          90s;

    gzip off;
    gzip_disable "MSIE [1-6]\.";

    # FORWARD CLIENT IDENTITY TO SERVER
    proxy_set_header    HOST                $http_host;
    proxy_set_header    X-Forwarded-Proto   $scheme;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

    # FULLY DISABLE SERVER CACHE
    add_header          Last-Modified $date_gmt;
    add_header          'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    if_modified_since   off;
    expires             off;
    etag                off;
    proxy_no_cache      1;
    proxy_cache_bypass  1;

    # SSL CONF, STRONG CIPHERS ONLY
    ssl_protocols               TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers   on;
    ssl_certificate             /www/certs/${CERT_FILENAME};
    ssl_certificate_key         /www/certs/${KEY_FILENAME};
    ssl_ecdh_curve              secp521r1:secp384r1:prime256v1;
    ssl_buffer_size             4k;

    # DISABLE SSL SESSION CACHE
    ssl_session_tickets         off;
    ssl_session_cache           none;

    access_log /var/log/nginx/audit_platform_access.log main;
    error_log  /var/log/nginx/audit_platform_error.log debug;

    server {
        listen          ${INTERFACE_HTTPS_PORT} ssl;
        server_name     ${SERVER_NAME};
        root            /www/data;
        index           index.html;
        error_page      500 502 503 504  /50x.html;

        add_header Content-Security-Policy $csp_header;

        # SECURITY HEADERS
        add_header X-XSS-Protection             "1; mode=block";
        add_header X-Frame-Options              DENY;
        add_header X-Content-Type-Options       nosniff;
        # max-age = 31536000s = 1 year
        add_header Strict-Transport-Security    "max-age=31536000: includeSubDomains" always;
        add_header Front-End-Https              on;

        location / {
            proxy_pass http://${IRIS_FRONTEND_SERVER}:${IRIS_FRONTEND_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            # SvelteKit's adapter-node reads these two (see
            # HOST_HEADER=x-forwarded-host + PROTOCOL_HEADER in the
            # frontend env) to rebuild the URL it checks `Origin`
            # against. Without them it sees `localhost:5173` and rejects
            # every POST as "Cross-site POST form submissions are
            # forbidden"; with the wrong value it does the same on any
            # hostname or port but the one it was handed. See the maps
            # at the top of this file.
            proxy_set_header X-Forwarded-Proto $iris_forwarded_proto;
            proxy_set_header X-Forwarded-Host $iris_forwarded_host;
            proxy_set_header Origin $http_origin;
        }

        #location /api/v2/ {
        #    proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
        #
        #    location ~ ^/(manage/templates/add|manage/cases/upload_files) {
        #        keepalive_timeout           10m;
        #        client_body_timeout         10m;
        #        send_timeout                10m;
        #        proxy_read_timeout          10m;
        #        client_max_body_size        0M;
        #        proxy_request_buffering off;
        #        proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
        #    }

        #location ~ ^/(datastore/file/add|datastore/file/add-interactive) {
        #        keepalive_timeout           10m;
        #        client_body_timeout         10m;
        #        send_timeout                10m;
        #        proxy_read_timeout          10m;
        #        client_max_body_size        0M;
        #        proxy_request_buffering off;
        #        proxy_pass  http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT};
        #    }
        #}

        location /socket.io {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT}/socket.io;
        }

        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}